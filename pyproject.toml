[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftadvisor"
version = "0.1.0"
description = "Live fantasy football draft advisor for Sleeper or ESPN leagues: ML projections, value-based strategy, optional Claude chat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "numpy>=1.26",
    "anthropic>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# everything beyond the lean web runtime: data download, model training, CLI dashboard
full = ["pandas>=2.1", "scikit-learn>=1.4"]
dev = ["pandas>=2.1", "scikit-learn>=1.4", "rich>=13.7", "pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "playwright>=1.40"]

[project.scripts]
draftadvisor = "draftadvisor.cli:main"

[tool.setuptools.packages.find]
include = ["draftadvisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
