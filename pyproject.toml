[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftadvisor"
version = "0.1.0"
description = "Live Sleeper fantasy football draft advisor: ML projections, value-based strategy, and Claude research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "rich>=13.7",
    "anthropic>=1.0",
    "sleeper-api-wrapper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
draftadvisor = "draftadvisor.cli:main"

[tool.setuptools.packages.find]
include = ["draftadvisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
